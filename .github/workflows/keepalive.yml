# Keeps the free Supabase project from pausing (it pauses after ~7 days without database use).
# Twice a day it reads one row through the public API, using the publishable key already in site/config.js.
name: Supabase keep-alive
on:
  schedule:
    - cron: '17 5,17 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: site/config.js
          sparse-checkout-cone-mode: false
      - name: Query the database
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' site/config.js | head -1)
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' site/config.js | head -1)
          test -n "$URL" && test -n "$KEY" || { echo "Couldn't find the Supabase address or key in site/config.js"; exit 1; }
          for t in profiles ratings invites; do
            code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' "$URL/rest/v1/$t?select=*&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            echo "$t: HTTP $code"
            case "$code" in 2*) ;; *) echo "::error::Supabase answered $code for $t (paused or down?)"; exit 1;; esac
          done
